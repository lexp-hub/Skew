name = "skew"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Cloudflare Workers AI Binding (Run Llama 3.3, Mistral, Qwen, DeepSeek directly on Cloudflare Edge GPUs)
[ai]
binding = "AI"

[vars]
