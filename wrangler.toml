OLLAMA_BASE_URL = "http://localhost:11434"
GROQ_API_KEY = ""
OPENAI_API_KEY = ""
OPENROUTER_API_KEY = ""
ANTHROPIC_API_KEY = ""
GEMINI_API_KEY = ""
